<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="LIEN CONSTRUCTION">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdcdc"/>
      <stop offset="0.45" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="0.5" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset="0.5" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="metalText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="0.35" stop-color="#7a7a7a"/>
      <stop offset="0.55" stop-color="#1c1c1c"/>
      <stop offset="0.78" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <!-- Isometric cube -->
  <g stroke="#000" stroke-width="2" stroke-linejoin="round">
    <!-- top face -->
    <polygon points="180,18 250,54 180,90 110,54" fill="url(#faceTop)"/>
    <!-- left face -->
    <polygon points="110,54 180,90 180,150 110,114" fill="url(#faceLeft)"/>
    <!-- right face -->
    <polygon points="250,54 180,90 180,150 250,114" fill="url(#faceRight)"/>
    <!-- interlock notch on left face -->
    <polygon points="132,70 158,84 158,104 144,96 144,110 132,103" fill="#000" opacity="0.85"/>
    <!-- interlock notch on right face -->
    <polygon points="228,70 202,84 202,104 216,96 216,110 228,103" fill="#000" opacity="0.85"/>
  </g>

  <!-- LIEN -->
  <text x="180" y="170" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="46" letter-spacing="2"
        fill="url(#metalText)" stroke="#0a0a0a" stroke-width="1">LIEN</text>

  <!-- CONSTRUCTION -->
  <text x="180" y="192" text-anchor="middle"
        font-family="Arial, sans-serif" font-weight="700"
        font-size="16" letter-spacing="6"
        fill="#1a1a1a">CONSTRUCTION</text>
</svg>
